plugins { id 'com.android.application' }

android {
    namespace 'app.tide.rhythm'
    compileSdk 35

    defaultConfig {
        applicationId 'app.tide.rhythm'
        minSdk 26
        targetSdk 34
        // CI passes its run number so every build installs over the previous one
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName '1.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }
    signingConfigs {
        // One fixed key so updates install over each other. See README: it is public, so only install builds from your own repo.
        shared {
            storeFile file('../tide.keystore')
            storePassword 'tide-app'
            keyAlias 'tide'
            keyPassword 'tide-app'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.shared }
        release { signingConfig signingConfigs.shared; minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets { main { assets.srcDirs += [layout.buildDirectory.dir('webassets')] } }
    lint { abortOnError false; checkReleaseBuilds false }
}

// The web app at the repository root is the app's screens; copy it in at build time.
tasks.register('syncWeb', Copy) {
    from('../..') { include 'index.html', 'styles.css', 'app.js', 'photos.js', 'img/**', 'icons/**' }
    into layout.buildDirectory.dir('webassets/web')
}
preBuild.dependsOn syncWeb

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.work:work-runtime:2.9.1'
}
