name: Android app

on:
  push:
    paths: ['android/**', 'index.html', 'styles.css', 'app.js', 'photos.js', 'img/**', 'icons/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --console=plain
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Tide.apk
          gh release delete android-latest --yes --cleanup-tag || true
          sleep 3
          gh release create android-latest Tide.apk --target "$GITHUB_SHA" \
            --title "Tide for Android (build $GITHUB_RUN_NUMBER)" \
            --notes "Open this page on your phone, download Tide.apk and install it. It updates over earlier builds and keeps your data."
