<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ebb</title>
<meta name="description" content="A daily rhythm you can reshape: schedule, tasks, journal, breathing and a calm kit.">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://api.github.com https://gist.githubusercontent.com https://www.googleapis.com https://tasks.googleapis.com https://accounts.google.com; frame-src https://accounts.google.com; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#fbfcfb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1413" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ebb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="view"></main>



<nav class="tabs" aria-label="Sections">
  <button data-tab="today"><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="7" r="1.6"/><path d="M11 7h8M11 12h8M11 17h8"/><circle cx="6" cy="12" r="1.6"/><circle cx="6" cy="17" r="1.6"/></g></svg>Today</button>
  <button data-tab="journal"><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h11a1.5 1.5 0 0 1 1.5 1.5V20H7.5A1.5 1.5 0 0 1 6 18.5z"/><path d="M9.5 8.5h5.5M9.5 12h5.5"/></g></svg>Journal</button>
  <button id="waveBtn" class="wave-tab" data-act="wave" aria-label="A wave hit. Open the calm steps."><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 10c2.5 0 2.5-3 5-3s2.5 3 5 3 2.5-3 5-3 2.5 3 5 3M2 16c2.5 0 2.5-3 5-3s2.5 3 5 3 2.5-3 5-3 2.5 3 5 3"/></g></svg></button>
  <button data-tab="calm"><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></g></svg>Calm</button>
  <button data-tab="progress"><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20v-6M12 20V5M19 20v-9"/></g></svg>Progress</button>
  <button data-tab="more"><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></g></svg>More</button>
</nav>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-bg" data-act="close-sheet"></div>
  <div class="sheet-card" role="dialog" aria-modal="true"><div id="sheetBody"></div></div>
</div>
<div id="lock" class="lock" hidden>
  <form data-form="unlock" class="lock-card">
    <span class="mark">Ebb</span>
    <p id="lockMsg">Enter your PIN</p>
    <input type="password" id="pinIn" inputmode="numeric" autocomplete="off" maxlength="8" aria-label="PIN">
    <button class="btn primary">Unlock</button>
  </form>
</div>
<div id="toast" class="toast" hidden></div>

<script src="photos.js"></script>
<script src="app.js"></script>
</body>
</html>
